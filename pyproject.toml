[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "automdev"
version = "0.1.0"
description = "Official Python SDK for the Autom SERP API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Autom", email = "contact@autom.dev" },
]
keywords = [
  "serp-api",
  "google-search-api",
  "search-api",
  "seo",
  "api",
  "sdk",
  "autom",
]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://www.autom.dev"
Documentation = "https://docs.autom.dev"
Repository = "https://github.com/automdev/autom-python"
Issues = "https://github.com/automdev/autom-python/issues"

[tool.hatch.build.targets.sdist]
include = ["/examples", "/src", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/autom"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
